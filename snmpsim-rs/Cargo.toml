[package]
name = "snmpsim-rs"
version = "1.0.0"
edition = "2021"
description = "SNMP Agent Simulator in Rust - a faithful port of snmpsim"
license = "BSD-2-Clause"

[[bin]]
name = "snmp-command-responder"
path = "src/bin/responder.rs"

[[bin]]
name = "snmp-rec-to-rec"
path = "src/bin/rec2rec.rs"

[lib]
name = "snmpsim"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
bzip2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"
